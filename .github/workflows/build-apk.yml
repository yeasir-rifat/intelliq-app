name: Build Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download fonts (Poppins, Hind Siliguri, Noto Serif Bengali)
        run: bash android/scripts/fetch_fonts.sh

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: IntelliQ-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
